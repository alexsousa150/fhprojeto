server:
  port: ${PORT:8085}
  servlet:
    context-path: /

spring:
  application:
    name: gestao-marcenaria-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Configurações de Segurança e JWT
security:
  jwt:
    # Chave secreta de no mínimo 256 bits codificada em Base64
    secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000       # 15 minutos
    refresh-token-expiration-ms: 604800000   # 7 dias
    mfa-ticket-expiration-ms: 180000        # 3 minutos
  brute-force:
    max-attempts: 5
    lockout-duration-minutes: 15
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://localhost:8085"

app:
  open-browser: true
  versao: ${APP_VERSION:1.0.1}
  update:
    github-repo: ${GITHUB_UPDATE_REPO:alexsousa150/fhprojeto-releases}

---
# Perfil Local Persistente com SQLite
# O banco de dados fica salvo no arquivo ./data/marcenaria.db (compatível com DB Browser for SQLite)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:sqlite:./data/marcenaria.db?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false

---
# Perfil de Produção / PostgreSQL Real (opcional)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marcenaria_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
